    <script type="application/ld+json">
        {
            "@context": "https://schema.org/",
            "@type": "Person",
            "name": "Joanna Oates",
            "jobTitle": "Psychotherapist and Nutritional Therapist",
            "telephone": "+447812087347",

<body>
    <a class="skipLink" href="#main">Skip to main content</a>

    <header>
        <nav class="topnav">
            <button id="burger" class="material-symbols-outlined" aria-label="Toggle navigation menu">
                menu
            </button>
            <a class="collapsable" href="/">Home</a>
            <a class="collapsable" href="/about">About</a>
            <a class="collapsable" href="/eating-disorders">Eating Disorders</a>

        </nav>
    </header>

    <main id="main" tabindex="-1" class="container formMargin">
        <div class="info">
            <h1 class="center">Contact</h1>
            <div class="purpleLine"></div>
            <ul class="dropShadow">
                <li class="center">My email: hello@joannaoates.com</li>
                <li class="center">My mobile:
                    +447812087347</li>
            </ul>
            <form class="dropShadow slimBorder" name="contact" method="POST" netlify-honeypot="bot-field"
                data-netlify="true">
                <input type="hidden" name="subject" value="Inquiry from joannaoates.com" />
                <p class="hidden">
                    <label>
                        Additional: <input name="bot-field" />
                    </label>
                </p>
                <p>
                    <label for="contact-email">Email:</label>
                    <input type="email" id="contact-email" name="email" required />
                </p>
                <p>
                    <label for="contact-message">Message:</label>
                    <textarea class="messageContact" id="contact-message" name="message"></textarea>
                </p>
                <div class="captcha" data-netlify-recaptcha="true"></div>
                <p>
                    <button type="submit">Send</button>
                </p>
            </form>
            <div class="purpleLine"></div>
        </div>
    </main>

    <footer>
        <p><a href="/contact">Book a discovery call</a></p>
    </footer>

</body>
