[build]
  command = "npm run build-prod"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"

# Old .html URLs redirect to the extensionless form. force = true is needed because the .html files exist.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/eating-disorders.html"
  to = "/eating-disorders"
  status = 301
  force = true

[[redirects]]
  from = "/nutritional-therapy.html"
  to = "/nutritional-therapy"
  status = 301
  force = true

[[redirects]]
  from = "/consultations.html"
  to = "/consultations"
  status = 301
  force = true

[[redirects]]
  from = "/qualifications.html"
  to = "/qualifications"
  status = 301
  force = true

[[redirects]]
  from = "/podcast.html"
  to = "/podcast"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

# Hashed JS and CSS (webpack contenthash) can be cached for a year. HTML keeps Netlify default (max-age=0, must-revalidate).
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

